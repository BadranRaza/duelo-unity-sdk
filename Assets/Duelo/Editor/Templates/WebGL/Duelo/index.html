<!doctype html>
<!-- DUELO_TEMPLATE_VERSION: 2 -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #05070b;
      }

      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #05070b;
      }

      #unity-loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #f7f7fb;
        font-family: Arial, sans-serif;
        font-size: 14px;
        letter-spacing: 0.04em;
        background: #05070b;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading">Loading match...</div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loading = document.querySelector("#unity-loading");
      const buildUrl = "Build";
      const config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
      };

      createUnityInstance(canvas, config, (progress) => {
        if (loading)
          loading.textContent = `Loading match... ${Math.round(progress * 100)}%`;
      })
        .then((instance) => {
          window.unityInstance = instance;
          if (loading) loading.remove();
          window.parent?.postMessage(
            { type: "duelo-ready", payload: {} },
            window.location.origin,
          );
        })
        .catch((error) => {
          console.error(error);
          if (loading) loading.textContent = "Unity failed to load.";
        });
    </script>
  </body>
</html>
